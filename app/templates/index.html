<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteorological Fire - Forecast Dashboard</title>
  
  <!-- FontAwesome Icons & Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /> 
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Plotly JS (Load in head so it is ready before main.js) -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-header">
    <div class="header-left">
      <div class="logo-group">
        <span class="logo-bold">DGM</span>
        <span class="logo-divider">|</span>
        <span class="logo-light">SRM-B</span>
      </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="header-nav">
      <button class="nav-btn active" data-nav="MON">Historical</button>
      <button class="nav-btn" data-nav="FOR">Forecast</button>
      <button class="nav-btn" data-nav="About">About</button>
    </nav>

    <div class="header-right">
      <span class="badge-lang">UTC+3</span>
      <i class="fa-solid fa-user"></i>
    </div>
  </header>

  <!-- Main Layout Wrapper -->
  <div class="main-container">

    <!-- Icon Sidebar Wrapper -->
    <aside id="sidebar" class="sidebar">
      <div id="icon-bar" class="icon-bar">
        <!-- Icons populated dynamically by JS -->
      </div>
    </aside>

    <!-- Slide-out Drawer Panel for Selected Icon -->
    <div id="text-drawer" class="text-drawer hidden">
      <div class="drawer-header">
        <h4 id="drawer-title">Layer Controls</h4>
        <button id="close-drawer" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Layer Control Section -->
      <div class="panel-section">
        <div class="layer-control">
          <div class="layer-item">
            <span><i class="fa-solid fa-fire-flame-curved"></i> Fire Overlay (Last 24h)</span>
            <div class="layer-actions">
              <i id="toggle-fire-btn" class="fa-solid fa-eye active-icon" title="Toggle Fire Layer on Right Map"></i>
            </div>
          </div>

          <div class="transparency-control">
            <label>Tile Transparency</label>
            <input type="range" id="opacity-slider" min="0" max="100" value="75" class="slider">
            <span id="opacity-val" class="val-text">75%</span>
          </div>

          <!-- Layer Control Section inside #text-drawer -->
          <div class="panel-section">
            <h5 class="section-subtitle">Boundary Overlays (Right Map)</h5>
            
            <div class="layer-control">
              <!-- Districts Checkbox -->
              <label class="checkbox-item">
                <input type="checkbox" id="chk-districts" class="layer-checkbox" data-layer="districtMdg">
                <span><i class="fa-solid fa-map-location-dot"></i> District Boundaries</span>
              </label>
            
              <!-- Protected Areas Checkbox -->
              <label class="checkbox-item">
                <input type="checkbox" id="chk-protected-areas" class="layer-checkbox" data-layer="PA">
                <span><i class="fa-solid fa-tree"></i> Protected Areas</span>
              </label>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Content & Dual Map View Area -->
    <main id="content-area" class="content-area">

      <!-- VIEWPORT 1: MON & FOR MAP DASHBOARD (ACTIVE BY DEFAULT) -->
      <div id="app-viewport" class="viewport">
        <!-- Time Selector Pill Bar -->
        <div id="time-bar" class="time-bar">
          <span class="time-label" id="time-bar-label">Select Time:</span>
          <div id="time-pills" class="time-pills"></div>
        </div>

        <!-- Dual Map Split View Container -->
        <div id="map-container" class="map-container">
          <div class="map-window">
            <div id="map-left" class="map-frame"></div>
            <div class="map-overlay-title left"> Climate - Weather </div>
          </div>

          <div class="map-window">
            <div id="map-right" class="map-frame"></div>
            <div class="map-overlay-title right"> Fire </div>
          </div>
        </div>
      </div>

      <!-- VIEWPORT 2: ABOUT PAGE (HIDDEN BY DEFAULT) -->
      <div id="about-viewport" class="viewport hidden">
        <section class="about-page" style="padding: 2rem; color: #fff;">
          <h2>About This Platform</h2>
          <p>Custom weather and climate monitoring dashboard.</p>
        </section>
      </div>

<!-- Chart Modal Container -->
      <div id="chart-container" class="chart-modal hidden">
        <!-- Header Bar: Holds Dynamic Title, Download Icon & Close Button -->
        <div class="chart-modal-header">
          <div class="chart-title-group">
            <i class="fa-solid fa-chart-line title-icon"></i>
            <span id="chart-modal-title" class="chart-modal-title">Climatology Overview</span>
          </div>
          
          <div class="chart-header-actions" style="display: flex; align-items: center; gap: 8px;">
            <button id="download-chart-btn" class="chart-close-btn" title="Download Chart PNG">
              <i class="fa-solid fa-download"></i>
            </button>
            <button id="close-chart-btn" class="chart-close-btn" title="Close Panel">&times;</button>
          </div>
        </div>

        <!-- Plotly Render Target -->
        <div id="chart-plotly-target" class="chart-plotly-target"></div>
      </div>

    </main>

  </div>

  <!-- Leaflet Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.sync@0.2.4/L.Map.Sync.min.js"></script>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
